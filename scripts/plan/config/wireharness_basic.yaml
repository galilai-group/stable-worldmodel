# Closed-loop evaluation for the single-mover WireHarnessBasic environment.
defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  # This registry ID currently points to WireHarnessBasicEnv.
  env_name: swm/WireHarness-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  camera_view: top
  add_pixels: true

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - state
    - goal_state

seed: 42
policy: random
world_image_shape: [176, 320]

plan_config:
  horizon: 10
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 1
  goal_offset_steps: 5
  eval_budget: 100
  img_size: 224
  dataset_name: wireharness_expert.lance
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: wireharness_basic_results.txt
